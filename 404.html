<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found | RimBlaze</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800..900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2EE;--text:#1C1612;--muted:#6B5D51;--leather:#D9480F}
@media (prefers-color-scheme: dark){:root{--bg:#0E0C0A;--text:#F2ECE5;--muted:#A99A8C;--leather:#FF7A3D;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-left))}
main{max-width:560px}
h1{font-family:Archivo,Impact,sans-serif;font-stretch:78%;font-weight:900;text-transform:uppercase;font-size:clamp(2.6rem,10vw,4.6rem);line-height:1;margin:16px 0 12px}
h1 em{font-style:normal;color:var(--leather)}
p{color:var(--muted);margin:0 0 22px}
a.btn{display:inline-block;background:var(--leather);color:#fff;text-decoration:none;font:600 12px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;border-radius:3px}
</style>
</head>
<body>
<main>
  <img src="/favicon.svg" width="48" height="48" alt="">
  <h1>Air <em>ball.</em></h1>
  <p>That page isn’t here. It may have moved, or the player profile hasn’t been built yet.</p>
  <a class="btn" href="/">Back to the live feed</a>
</main>
<script>
// A player address with the wrong name part (an old link like /players/s-curry-201939/) still ends in
// the player's NBA.com id: look the id up and forward to his real profile.
(function(){
  var m=/^\/players\/(?:[^\/]*-)?(\d+)\/?$/.exec(location.pathname);
  if(!m)return;
  var id=+m[1];
  document.querySelector('main p').textContent='Looking up that player…';
  fetch('/data/players.json').then(function(r){return r.ok?r.json():[];}).then(function(list){
    var p=(list||[]).find(function(x){return x.id===id;});
    if(p&&location.pathname!=='/players/'+p.slug+'/'){location.replace('/players/'+p.slug+'/'+location.hash);return;}
    document.querySelector('main p').textContent='We don’t have a profile for that player yet. Profiles cover every active player and the all-time greats.';
  }).catch(function(){});
})();
</script>
</body>
</html>

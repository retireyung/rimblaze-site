name: Nightly stats

# stats.nba.com doesn't answer GitHub's cloud servers, so the nightly build runs on a
# home computer instead (tools/run-nightly.ps1 + tools/setup-windows.ps1). This workflow
# stays for manual runs, e.g. through a residential proxy later.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Past seasons and per-game play-by-play never change, so keep them between runs.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: rimblaze-cache-${{ github.run_id }}
          restore-keys: rimblaze-cache-

      - name: Build stats
        run: node scripts/build-stats.mjs

      - name: Commit data
        run: |
          git config user.name "rimblaze-bot"
          git config user.email "bot@rimblaze.com"
          git add -A   # data/cache stays out via .gitignore
          git diff --cached --quiet || git commit -m "Nightly stats $(date -u +%F)"
          git push
